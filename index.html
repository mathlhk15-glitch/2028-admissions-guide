<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123a63">
<title>2028 대입 길잡이 · 29개 대학</title>
<meta name="description" content="29개 대학 2027→2028 대입전형 시행계획 비교 — 학생·학부모·교사용 검색·비교·수능최저 계산 도구">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--ink:#14213a;--ink2:#34445d;--muted:#66768c;--line:#dde4ec;--line2:#eef2f6;
  --navy:#123a63;--navy2:#0d2a49;--sky:#eaf2fa;--accent:#d9682b;--accent2:#fff3ea;
  --up:#1f6fb2;--upbg:#e6f0fa;--down:#c2412d;--downbg:#fbebe7;--ok:#0e7a55;--okbg:#e4f5ee;--warn:#9a5b00;--warnbg:#fff6e0;
  --r:16px;--sh:0 1px 2px #12213a0d,0 6px 20px #12213a0f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.62 "Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.012em;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--navy)}
h1,h2,h3,h4{line-height:1.3;margin:0;letter-spacing:-.025em}
h2{font-size:clamp(21px,3vw,27px)}
h3{font-size:19px}
p{margin:.4em 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid #f0a35e;outline-offset:2px;border-radius:6px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.topin{max-width:1200px;margin:auto;padding:10px 16px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;color:var(--navy);text-decoration:none;white-space:nowrap}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--navy);color:#fff;font-style:normal;font-size:13px;font-weight:800}
.brand small{font-weight:600;color:var(--muted);font-size:13px}
.tsearch{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--line2);border:1px solid transparent;border-radius:12px;padding:0 12px;height:42px}
.tsearch:focus-within{background:#fff;border-color:var(--navy)}
.tsearch input{flex:1;border:0;background:transparent;outline:0;height:40px;min-width:0}
.tsearch kbd{font:12px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:#fff}
.nav{max-width:1200px;margin:auto;display:flex;gap:2px;overflow-x:auto;padding:6px 12px 0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:650;font-size:15px;padding:9px 12px 11px;border-bottom:3px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--navy);border-color:var(--accent)}
.nav a b{display:inline-block;font-size:11px;background:var(--accent);color:#fff;border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:2px}

.wrap{max-width:1200px;margin:auto;padding:22px 16px 80px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:18px;box-shadow:var(--sh)}
.panel>h2+p,.lead{color:var(--muted)}
.kick{display:block;font-size:12.5px;font-weight:750;letter-spacing:.06em;color:var(--accent);margin-bottom:6px;text-transform:uppercase}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:30px 2px 14px}
.sec-h p{color:var(--muted);margin:4px 0 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:9px 14px;font-weight:650;font-size:15px;text-decoration:none;line-height:1.3;min-height:42px}
.btn:hover{border-color:#b8c5d4;background:#fafcfe}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:6px 10px;font-size:14px;min-height:34px;border-radius:9px}
.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:14.5px;font-weight:600;color:var(--ink2);min-height:36px}
.chip:hover{border-color:#a9b8c9}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{opacity:.7;font-weight:500;margin-left:3px}
.tag{display:inline-block;font-size:12.5px;font-weight:650;border-radius:6px;padding:1px 7px;background:var(--sky);color:var(--navy);white-space:nowrap}
.tag.o{background:var(--accent2);color:#a2451a}
.tag.g{background:var(--okbg);color:var(--ok)}
.tag.r{background:var(--downbg);color:var(--down)}
.tag.y{background:var(--warnbg);color:var(--warn)}
.up{color:var(--up);font-weight:700}
.down{color:var(--down);font-weight:700}
.zero{color:var(--muted);font-weight:700}
.note{background:var(--warnbg);border:1px solid #f1dfae;border-radius:12px;padding:12px 15px;color:#5c4100;font-size:15px}
.note.blue{background:var(--sky);border-color:#cfe0f0;color:#1d3a5a}
.note.fix{background:#fdf0ec;border-color:#f3cfc4;color:#6d2617}
.note b{font-weight:750}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:10px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
th,td{padding:10px 12px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
th{background:#f6f8fb;color:var(--ink2);font-weight:700;font-size:14px;white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.k{font-weight:700;color:var(--ink);min-width:118px}
td.k small{display:block;font-weight:500;color:var(--muted);font-size:13px}
td.old{color:var(--muted);min-width:180px}
td.new{min-width:200px}
td.new b{color:var(--navy)}
td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cmp-tbl td:nth-child(2){color:var(--muted)}
.arrow-cell{position:relative}
mark{background:#ffe7a8;color:inherit;border-radius:3px;padding:0 1px}
a.uni{font-weight:700;text-decoration:none;border-bottom:1px dashed #9db3cb}
a.uni:hover{border-bottom-style:solid}

/* home hero */
.hero{display:grid;grid-template-columns:1.45fr 1fr;gap:0;background:var(--navy);color:#fff;border-radius:22px;overflow:hidden;box-shadow:0 14px 40px #12305540}
.hero-main{padding:38px 36px 34px}
.hero .eyebrow{display:inline-block;border:1px solid #ffffff40;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:#cfe0f2}
.hero h1{font-size:clamp(32px,5vw,52px);margin:16px 0 12px;font-weight:800;letter-spacing:-.04em;line-height:1.15}
.hero h1 em{font-style:normal;color:#ffb27e}
.hero p{color:#d6e3f1;font-size:17px;max-width:560px}
.hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.hero .btn{border-color:#ffffff38;background:#ffffff12;color:#fff}
.hero .btn:hover{background:#ffffff22}
.hero .btn.acc{background:var(--accent);border-color:var(--accent)}
.hero-side{background:#0c2c4d;padding:30px 30px 26px;display:flex;flex-direction:column;gap:14px}
.hero-side h3{font-size:13px;color:#a9c2db;letter-spacing:.06em;font-weight:700}
.hs-row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #ffffff1c;padding-bottom:10px}
.hs-row span{color:#c2d4e7;font-size:14.5px}
.hs-row b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.hs-row b small{font-size:14px;font-weight:600;color:#c2d4e7;margin-left:3px}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.qcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:var(--sh);min-height:124px}
.qcard:hover{border-color:#9fb4ca;transform:translateY(-1px)}
.qcard .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sky);color:var(--navy);font-weight:800}
.qcard b{font-size:16.5px}
.qcard span{font-size:14px;color:var(--muted)}

.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fcard{position:relative;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;min-height:170px;box-shadow:var(--sh)}
.fcard:hover{border-color:var(--navy)}
.fcard .no{font-size:13px;font-weight:800;color:var(--accent)}
.fcard b{font-size:17.5px;line-height:1.35}
.fcard p{font-size:14.5px;color:var(--muted);margin:0}
.fcard .big{margin-top:auto;font-size:14px;font-weight:700;color:var(--navy)}

/* bars */
.dchart{display:grid;gap:5px}
.drow{display:grid;grid-template-columns:86px 1fr 1fr 56px;align-items:center;gap:6px;font-size:14px}
.drow .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .neg,.drow .pos{height:16px;display:flex}
.drow .neg{justify-content:flex-end;border-right:2px solid #9aabbd}
.drow .neg i{background:var(--down);border-radius:4px 0 0 4px;display:block;height:100%}
.drow .pos i{background:var(--up);border-radius:0 4px 4px 0;display:block;height:100%}
.drow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.drow{text-decoration:none;color:inherit}
.drow:hover{background:var(--line2);border-radius:6px}
.drow a{color:inherit;text-decoration:none}
.legend{display:flex;gap:14px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 8px}
.mini div{background:var(--line2);border-radius:10px;padding:8px 10px}
.mini span{display:block;font-size:12.5px;color:var(--muted)}
.mini b{font-size:15.5px;font-variant-numeric:tabular-nums}

/* universities list */
.ufilter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.ulist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ucard{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh);text-decoration:none;color:inherit}
.ucard:hover{border-color:var(--navy)}
.ucard h3{font-size:19px;display:flex;align-items:center;gap:8px}
.ucard .reg{font-size:13px;color:var(--muted)}
.ucard .st{font-size:14.5px;color:var(--ink2);margin-top:auto}
.star{position:absolute;top:10px;right:10px;border:0;background:transparent;font-size:21px;color:#c7d0da;width:40px;height:40px;border-radius:10px}
.star.on{color:#f0a020}
.star:hover{background:var(--line2)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* university detail */
.uhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.uhead h1{font-size:clamp(28px,4.4vw,40px);font-weight:800;letter-spacing:-.035em}
.crumb{font-size:14px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
.stat{background:var(--line2);border-radius:13px;padding:13px 15px}
.stat span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.stat em{font-style:normal;font-size:14.5px}
.summary{display:grid;grid-template-columns:.9fr 1.4fr;gap:20px;background:var(--accent2);border:1px solid #f5d8c4;border-radius:14px;padding:18px 20px;margin-top:14px}
.summary h3{color:#93401a;font-size:18px}
.summary ol{margin:0;padding-left:20px}
.summary li{margin:4px 0}
.ftags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ftags a{text-decoration:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;padding:10px 14px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;font-size:15.5px}
.tabs button.on{color:var(--navy);border-color:var(--navy)}
.cbar{display:flex;align-items:center;gap:6px;min-width:140px}
.cbar i{display:block;height:9px;border-radius:5px}
.cbar .a{background:#c6d1dd}
.cbar .b{background:var(--navy)}
.cbars{display:grid;gap:3px}
.same summary{cursor:pointer;font-weight:700;color:var(--ink2);padding:10px 0}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

.imgs{display:grid;gap:16px}
figure{margin:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#f6f8fb;font-weight:700;font-size:15px}
figure img{display:block;width:100%;height:auto;cursor:zoom-in;min-height:120px;background:#f3f5f8}
.ocr{white-space:pre-wrap;font-size:14px;color:var(--ink2);background:#fafbfd;padding:14px;max-height:420px;overflow:auto;border-top:1px solid var(--line2)}
.lite-ph{padding:22px;text-align:center;color:var(--muted);font-size:15px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:#0b1626ee;display:none;flex-direction:column}
.lb.open{display:flex}
.lb-bar{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#0b1626;color:#fff;flex-wrap:wrap}
.lb-bar .btn{background:#ffffff14;border-color:#ffffff30;color:#fff;min-height:38px;padding:6px 12px}
.lb-bar span{margin-left:auto;font-size:14px;color:#c8d6e5}
.lb-body{flex:1;overflow:auto;text-align:center;padding:12px}
.lb-body img{max-width:none;background:#fff}

/* match */
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.q{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:#fbfcfd}
.q h4{font-size:16px;margin-bottom:9px}
.q h4 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:5px}
.rcard{border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:12px;padding:16px 18px;margin:12px 0;background:#fff}
.rcard.o{border-left-color:var(--accent)}
.rcard.r{border-left-color:var(--down)}
.rcard.g{border-left-color:var(--ok)}
.rcard h3{font-size:18px;margin-bottom:6px}
.rcard ul{margin:6px 0 0;padding-left:20px}
.rcard li{margin:5px 0}
.rcard .why{font-size:14.5px;color:var(--muted)}

/* calculator */
.calc-in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.calc-in label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14.5px}
.calc-in select{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;font-size:17px;font-weight:700}
.calc-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.calc-sum div{background:var(--line2);border-radius:12px;padding:10px 12px}
.calc-sum span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.calc-sum b{font-size:20px}
.res td{vertical-align:middle}
.pill{display:inline-block;min-width:66px;text-align:center;border-radius:999px;padding:3px 10px;font-size:13.5px;font-weight:750}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.no{background:var(--downbg);color:var(--down)}
.pill.na{background:var(--line2);color:var(--muted)}

/* compare */
.csel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.csel select,.inp{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;width:100%;font-weight:650}
.cmp td{min-width:220px}
.cmp td:first-child{min-width:110px;font-weight:700;background:#fafbfd}
.cmp ul{margin:0;padding-left:16px}
.cmp li{margin:3px 0;font-size:14.5px}
.cmp li b{color:var(--ink2)}

/* guide */
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;margin:6px 0;background:#fff;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--navy);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.prog{height:8px;background:var(--line2);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:5px}
.tl{position:relative;margin:10px 0 0;padding-left:30px}
.tl:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{list-style:none;position:relative;margin:0 0 14px}
.tl li:before{content:"";position:absolute;left:-25px;top:7px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--navy)}
.tl li.now:before{background:var(--accent);border-color:var(--accent)}
.tl b{display:block}
.tl span{color:var(--muted);font-size:14.5px}
details.gl{border:1px solid var(--line2);border-radius:10px;margin:6px 0;background:#fff}
details.gl summary{cursor:pointer;padding:11px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.gl summary::-webkit-details-marker{display:none}
details.gl summary:after{content:"＋";color:var(--muted)}
details.gl[open] summary:after{content:"－"}
details.gl>div{padding:0 14px 13px;color:var(--ink2)}
textarea.inp{height:auto;min-height:110px;padding:10px 12px;font-weight:500;line-height:1.6}

/* sources */
details.src{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}
details.src>summary{cursor:pointer;padding:12px 15px;font-weight:700;display:flex;gap:10px;align-items:center}
details.src>div{padding:0 15px 15px}
.sid{flex:none;font-size:12.5px;background:var(--navy);color:#fff;border-radius:6px;padding:1px 7px}
.stext{white-space:pre-wrap;background:#fafbfd;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.snote{white-space:pre-wrap;font-size:14px;color:var(--ink2);background:var(--sky);border-radius:10px;padding:10px 12px}

/* search results */
.sres{display:grid;gap:10px}
.sitem{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:12px 15px;background:#fff}
.sitem:hover{border-color:var(--navy)}
.sitem .where{font-size:13px;color:var(--muted);font-weight:650}
.sitem .txt{font-size:15px;margin-top:3px}

.foot{max-width:1200px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13.5px}
.foot p{margin:4px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14.5px;z-index:120;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}

"text":"지도 포인트"},{"type":"text","text":"지역균형이 728명으로 크게 늘고 수능최저가 없어져, 서류와 면접만으로 당락이 갈립니다\n지역균형은 자사고·특목고·영재학교 학생이 지원할 수 없고, 추천 인원은 학교당 3명으로 늘었습니다\n정시는 지역균형이 사라지고, 1단계는 수능 등급, 2단계는 백분위와 교과역량평가로 선발합니다\n정시 2단계 교과역량평가는 행동특성·출결 등 공동체 역량까지 봅니다. 정시 준비생도 학생부 관리가 필요합니다"},{"type":"text","text":"26"}],"charts":[],"note":"[모집인원 메모] 서울대는 학생부교과·논술 전형이 없으며, 수시는 모두 학생부종합(음대 피아노·관현악과만 실기위주)으로 선발합니다 · 수시 기회균형은 정원 외 농생명계열 4명 이내 별도\n[출처] 출처: 서울대학교 대학 신입학생 입학전형 시행계획 2027학년도(2025. 4.) · 2028학년도(2026. 4.) · 증감·비율은 두 자료의 수치로 계산 · 2028 계획은 대교협 심의 결과에 따라 변경될 수 있음","uni":"서울대"},{"no":27,"title":"서울 주요 11 · 서울대","blocks":[{"type":"text","text":"서울 주요 11 · 서울대"},{"type":"text","text":"서울대학교 · 선발 방법 변화"},{"type":"table","rows":[["구분","2027학년도","2028학년도"],["지역균형 수능최저","4개 영역 중 3개 합 7등급 이내","적용하지 않음"],["지역균형 추천·자격","고교별 2명 이내","고교별 3명 이내 · 자사고·외고·국제고·과학고·영재학교 지원 불가"],["수시 일반 면접","제시문 기반 면접 및 구술고사","공동 출제 3유형: 분석적 주제토론 · 심층적 문제해결 · 융합적 과제수행"],["수시 일반 수능최저","디자인과만 3개 합 7","전 모집단위 적용하지 않음"],["정시 지역균형","153명 · 수능 60 + 교과평가 40","전형 폐지"],["정시 일반 방법","1단계 수능 100 (2배수) → 2단계 1단계 성적 80 + 교과평가 20","1단계 수능 100 (3배수) → 2단계 수능 60 + 교과역량평가 40"],["정시 수능 지표","표준점수","1단계 등급 환산 점수 · 2단계 백분위"],["정시 의대·수의대","면접은 결격 판단에만 활용","면접 20점 반영 (수능 60 + 교과역량 20 + 면접 20)"]]},{"type":"text","text":"27"}],"charts":[],"note":"[출처] 출처: 서울대학교 대학 신입학생 입학전형 시행계획 2027학년도(2025. 4.) · 2028학년도(2026. 4.) · 증감·비율은 두 자료의 수치로 계산 · 2028 계획은 대교협 심의 결과에 따라 변경될 수 있음","uni":"서울대"},{"no":28,"title":"서울 주요 11 · 연세대","blocks":[{"type":"text","text":"서울 주요 11 · 연세대"},{"type":"text","text":"연세대학교(서울) · 모집인원 변화"},{"type":"text","text":"수시모집"},{"type":"text","text":"정시모집"},{"type":"text","text":"구조 변화"},{"type":"text","text":"2,153 → 2,588"},{"type":"text","text":"1,686 → 1,355"},{"type":"text","text":"학종 재편 종합인재형·탐구인재형"},{"type":"text","text":"▲435"},{"type":"text","text":"▼331"},{"type":"text","text":"수시 + 정시 3,839 → 3,943"},{"type":"table","rows":[["전형","2027","2028","증감"],["학생부교과\n추천형","475","539","▲64"],["학생부종합\n전 세부전형 합","1,260","1,576","▲316"],["논술\n논술전형","269","318","▲49"],["정시 수능위주\n'가'군 일반·국제계열","1,289","962","▼327"]]},{"type":"text","text":"지도 포인트"},{"type":"text","text":"수시가 늘고 정시는 줄었습니다. 정시 수능위주 인원은 약 25% 감소(1,289 → 962, 계산값)\n교과·정시 모두 학생부 정성평가(서류평가) 가 새로 들어와 학생부 기록 관리의 비중이 커졌습니다\n논술은 수능최저가 생겨 수능 준비 없이 논술만으로 합격하기 어려워졌습니다\n신설 탐구인재형(일반)은 국내고 학생도 지원 가능하고 수능최저가 없어 새로운 선택지가 됩니다"},{"type":"text","text":"28"}],"charts":[],"note":"[모집인원 메모] 2027 학생부종합 = 활동우수형 697 + 국제형 254 + 국제인재 120 + 기회균형 189 · 2028 = 종합인재형 981 + 탐구인재형 375 + 기회균형 220 2027 정시 수능위주 = 일반계열 1,241 + 국제계열 48 · 2028은 국제계열을 일반계열로 통합(962) · 체능 51, 예능 120, 특기자 38은 두 해 동일 · 위 인원은 정원 내 기준(계약학과·고른기회 정원 외 별도)\n[출처] 출처: 연세대학교 입학전형 시행계획(서울캠퍼스) 2027학년도(2025. 4.) · 2028학년도(2026. 4.) · 증감·비율은 두 자료의 수치로 계산 · 세부 사항은 각 연도 모집요강으로 확인","uni":"연세대"},{"no":29,"title":"서울 주요 11 · 연세대","blocks":[{"type":"text","text":"서울 주요 11 · 연세대"},{"type":"text","text":"연세대학교(서울) · 선발 방법 변화"},{"type":"table","rows":[["구분","2027학년도","2028학년도"],["교과 [추천형]","일괄합산 · 교과 100","단계별 · 1단계 교과 100(5배수) → 2단계 교과 80 + 서류 20"],["교과 성적 산출","국·수·영·사·과, 9등급 등급점수 + Z점수","전 과목, 5등급 등급점수 70% + 성취도 30%"],["학생부종합 체계","활동우수형 · 국제형 · 국제인재 · 기회균형","종합인재형 · 탐구인재형(일반/국제) · 기회균형"],["학종 2단계","전 전형 서류 60 + 면접 40","종합인재형 서류 70 + 면접 30 · 그 외 60 + 40"],["논술 수능최저","미적용","적용 · 3개 합 6(약학과 5), 국·수 포함, 영어 3등급"],["정시 학생부","학생부(교과) 50점 정량 + 출결 감점","서류평가 100점 정성(교과학습발달상황·출결 등)"],["정시 수능 배점","950점 · 탐구 가산점 3%","900점 · 가산점 폐지, 사탐·과탐 모두 필수"],["정시 언더우드","국제계열 별도 · 단계별 면접 50","면접 폐지 · 일반계열과 동일(수능 900 + 서류 100)"]]},{"type":"text","text":"29"}],"charts":[],"note":"[출처] 출처: 연세대학교 입학전형 시행계획(서울캠퍼스) 2027학년도(2025. 4.) · 2028학년도(2026. 4.) · 증감·비율은 두 자료의 수치로 계산 · 세부 사항은 각 연도 모집요강으로 확인","uni":"연세대"},{"no":30,"title":"서울 주요 11 · 고려대","blocks":[{"type":"text","text":"서울 주요 11 · 고려대"},{"type":"text","text":"고려대학교 · 모집인원 변화"},{"type":"text","text":"수시모집"},{"type":"text","text":"정시모집"},{"type":"text","text":"구조 변화"},{"type":"text","text":"2,703 → 2,703"},{"type":"text","text":"1,870 → 1,867"},{"type":"text","text":"학교추천 최저 폐지 · 학업우수 면접 도입"},{ 트"},{"type":"text","text":"정시 인원이 300명 넘게 줄고 수시가 그만큼 늘었습니다. 한양대 지망이면 수시 비중을 높여 계획해야 합니다\n교과전형도 40%를 학생부종합평가로 보므로 세특·과목 선택 관리가 내신 등급만큼 중요해졌습니다\n교과 최저가 '합'에서 '각 3등급'으로 바뀌어, 한 과목이 4등급이면 다른 과목이 좋아도 불합격입니다\n학업형은 추천이 필요 없지만 최저가 생겼습니다(2027 서류형은 최저 없음)"},{"type":"text","text":"37"}],"charts":[],"note":"[모집인원 메모] 수시·정시 합계와 정시 군별 인원은 2028 계획의 '전형별 모집인원(정원 내/외)' 표 수치 · 학종 개별 인원은 두 해 모집인원 표 기준 · 2028 체육인재 1명 신설, 사회통합 5명 유지 · 2028 계획은 2027 인원이 첨단학과 증원 심사 결과에 따라 바뀔 수 있다고 명시\n[출처] 출처: 한양대학교 신입학 전형계획 2027학년도 · 2028학년도(5~7쪽 주요 변경사항) · 증감은 두 자료의 수치로 계산","uni":"한양대"},{"no":45,"title":"서울 주요 11 · 서울시립대","blocks":[{"type":"text","text":"서울 주요 11 · 서울시립대"},{"type":"text","text":"서울시립대학교 · 모집인원 변화"},{"type":"text","text":"수시모집"},{"type":"text","text":"정시모집"},{"type":"text","text":"구조 변화"},{"type":"text","text":"996 → 1,071"},{"type":"text","text":"855 → 833"},{"type":"text","text":"정시 학생부 20% 논술 최저 신설"},{"type":"text","text":"▲75"},{"type":"text","text":"▼22"},{"type":"text","text":"수시 + 정시 1,851 → 1,904"},{"type":"table","rows":[["전형","2027","2028","증감"],["지역균형선발\n학생부교과","241","346","▲105"],["학생부종합\n종합Ⅰ + 종합Ⅱ(서류형)","종합Ⅰ 391","Ⅱ 99 / 학생부종합 424 · 서류형 폐지","▼66"],["논술전형\n논술","80","86","▲6"],["수능 일반 가군\n정시","132","131","▼1"],["수능 일반 나군\n정시","534(수능 100)","543(수능 80 + 학생부 20)","▲9"]]},{"type":"text","text":"지도 포인트"},{"type":"text","text":"지역균형이 105명 늘어 346명이 되었고, 서류평가 40%에서 교과와 출결을 함께 봅니다. 재수생은 지원할 수 없습니다\n학종 서류형이 없어져 학생부종합은 모두 면접을 거칩니다\n논술에 최저(3합 7)가 생겨 수능 준비 없이 논술만으로는 합격할 수 없습니다\n정시에도 학생부 20%(교과 18 · 출결 2)가 들어가 3학년까지의 내신이 정시 점수에 영향을 줍니다\n학교폭력 조치사항 4호 이상이면 모든 전형에 지원할 수 없습니다"},{"type":"text","text":"45"}],"charts":[],"note":"[모집인원 메모] 기회균형Ⅰ 132 · 사회공헌·통합 46 유지 · 실기: 디자인학과가 정시 → 수시로 이동(수시 실기 7 → 37, 정시 실기 87 → 57) · 정시 나군에는 스포츠과학과 30(두 해 동일) 포함\n[출처] 출처: 서울시립대학교 2027학년도 입학전형 기본계획(1~3쪽, 7~8쪽, 21~22쪽) · 2028학년도 입학전형 시행계획(1~3쪽, 7~9쪽, 13쪽, 19~21쪽) · 증감은 두 자료의 수치로 계산","uni":"서울시립대"},{"no":52,"title":"서울·수도권 8 · 동국대","blocks":[{"type":"text","text":"서울·수도권 8 · 동국대"},{"type":"text","text":"동국대학교 · 모집인원 변화"},{"type":"text","text":"수시모집"},{"type":"text","text":"정시모집"},{"type":"text","text":"구조 변화"},{"type":"text","text":"1,770 → 2,097"},{"type":"text","text":"1,320 → 991"},{"type":"text","text":"수시 확대 정시 학생부 20%"},{"type":"text","text":"▲327"},{"type":"text","text":"▼329"},{"type":"text","text":"수시 + 정시 3,090 → 3,088"},{"type":"table","rows":[["전형","2027","2028","증감"],["학교장추천인재\n학생부교과","410","470","▲60"],["Do Dream + 불교추천\n학생부종합","764 (656 + 108)","1,002 (894 + 108)","▲238"],["논술\n논술","283","291","▲8"],["수능(일반)\n정시 가·나·다군","1,166 (가 433 · 나 418 · 다 315)","855 (가 332 · 나 327 · 다 196)","▼311"]]},{"type":"text","text":"지도 포인트"},{"type":"text","text":"수시 비중이 65%로 커지고 정시 수능(일반)은 311명 줄어듭니다. Do Dream만 238명 늘었습니다\n정시도 모든 군에서 학생부평가가 20% 반영되어, 정시 준비생도 학생부 관리가 필요합니다\n학교장추천 교과 환산의 단계 간 점수 차가 커져(1점씩), 내신 차이가 결과에 더 직접 드러납니다\n논술 최저는 전 모집단위 2합 5로 단순해졌고(약학 제외), 학종은 면접 비중이 40%로 올랐습니다"},{"type":"text","text":"52"}],"charts":[],"note":"[모집인원 메모] 불교추천인재는 두 해 모두 108 · 기회균형통합 132 → 134(학종 → 학생부교과로 이동) · 특성화고교졸업자는 정시(수능 100) → 수시 학종 18 · 수능(일반)에는 체육교육과·조소전공(수능 + 실기) 포함\n[출처] 출처: 동국대학교 2027학년도 대학입학전형 시행계획(4쪽, 14~21쪽, 36~43쪽) · 2028학년도 대학입학전형 시행계획(1~6쪽, 12~19쪽, 32~39쪽 — 표 이미지로 대조) · 증감은 두 자료의 수치로 계산","uni":"동국대"},{"no":54,"title":"서울·수도권 8 · 홍익대","blocks":[{"type":"text","text":"서울·수도권 8 · 홍익대"},{"type":"text","text":"홍익대학교 · 모집인원 변화"},{"type":"text","text":"수시모집"},{"type":"text","text":"정시모집"},{"type":"text","text":"구조 변화"},{"type":"text","text":"1,598 → 1,692"},{"type":"text","text":"904 → 808"},{"type":"text","text":"교과전형 확대 정시 교과 10% 도입"},{"type":"text","text":"▲94"},{"type":"text","text":"▼96"},{"type":"text","text":"수시 + 정시 2,502 → 2,500"},{"type":"table","rows":[["전형","2027","2028","증감"],["학교장추천자\n학생부교과","307","420","▲113"],["학교생활우수자\n학생부종합","467","457 (서류형 434 + 면접형 23)","▼10"],["논술\n논술","384","384","0"],["수능우수자\n정시 ㉰ + ㉯(미술)","850 (㉰ 770 · ㉯ 80)","746 (㉰ 668 · ㉯ 78)","▼104"]]},{"type":"text","text":"지도 포인트"},{"type":"text","text":"학교장추천자가 113명 늘고 고교별 추천 인원 제한(10명)이 없어졌습니다\n학교장추천자  {id:3,t:'교과전형은 재학생 중심',s:'졸업예정자 한정 · 추천 제한 폐지 · 정성평가',slides:[12,13],
  easy:'학생부교과 전형이 “고3 재학생(졸업예정자)만” 지원하도록 바뀐 곳이 많고, 학교장 추천 인원 제한은 풀리는 추세입니다. 내신 숫자만 보던 방식에 서류(정성)평가를 섞는 대학도 늘었습니다.',
  so:['재수 가능성이 있다면 졸업 후 지원 불가 전형을 미리 파악하세요.','연세대(서류 20)·고려대(서류 20)·한양대(학생부종합평가 40)·한국외대(정성 30)·서울시립대(서류 40)는 교과전형에서도 세특·과목 이수가 중요합니다.','전북대는 교과 기본점수가 930→500으로 낮아져 내신 차이가 점수에 크게 드러납니다.']},
 {id:4,t:'학종은 면접 강화 · 유형 분리',s:'면접 40% 확대 · 서류형/면접형 분리',slides:[14,15],

  so:['면접에 강하면 면접형, 수능최저를 맞출 수 있으면 최저가 있는 서류형이 대안이 됩니다.','고려대 계열적합은 면접이 없어지고 서류 100%가 되었습니다.','영남대 학종 지역인재가 15→278명으로 크게 늘었습니다(대구·경북).']},
 {id:5,t:'수능최저 재편',s:'신설·강화와 폐지·완화가 엇갈림',slides:[16,17,18,19,20],
  easy:'수능최저가 새로 생기거나 강화된 대학(연세대 논술·서강대 일반Ⅱ·한양대 학업형·이화여대 3합 7·건국대 교과)과, 없어지거나 완화된 대학(서울대 수시 전체·고려대 학교추천·영남대 기회균형)이 동시에 있습니다.',
  so:['작년 기준으로 판단하면 안 됩니다. 반드시 2028 기준으로 다시 확인하세요.','2028 수능부터 탐구가 통합사회·통합과학으로 바뀌어, “탐구 1과목”을 어떻게 세는지(사·과 분리 여부)가 대학마다 다릅니다.','이 안내서의 「수능최저 계산기」로 대표 기준을 빠르게 점검할 수 있습니다.']},
 {id:6,t:'정시 탐구 · 가산점 정리',s:'탐구 1과목 · 사과 분리 · 가산점 폐지',slides:[21],
  easy:'2028 수능에서 모든 학생이 통합사회·통합과학을 함께 보면서, 대학들이 탐구를 1과목만 반영하거나 사회·과학 비율을 따로 정하고, 미적분·기하·과탐 가산점을 없애는 쪽으로 정리했습니다.',
  so:['선택과목에 따른 유불리가 줄고, 국어·수학의 영향력이 커졌습니다(서강대 탐구 가중치 0.6→0.4, 건국대 국·수 80%, 전남대 탐구 10%).','인문계는 사회, 자연계는 과학 배점이 큰 대학이 많아 두 과목 모두 소홀히 할 수 없습니다.','두 유형 중 높은 점수를 반영하는 대학(한양대·중앙대 수능89·한국외대·건국대·영남대)은 유형별 환산을 꼭 해 보세요.']},

const AREAS=[['국','국어'],['수','수학'],['영','영어'],['사','통합사회'],['과','통합과학'],['한','한국사']];
let G=store.get('grades',{국:2,수:3,영:2,사:2,과:3,한:3}),CF=store.get('cf',{q:'',only:false});
function poolOf(p){if(Array.isArray(p))return p;const tam=Math.min(G.사,G.과);return p==='sep'?[['국',G.국],['수',G.수],['영',G.영],['사',G.사],['과',G.과]]:p==='t1h'?[['국',G.국],['수',G.수],['영',G.영],['탐',tam],['한',G.한]]:p==='sye'?[['수',G.수],['영',G.영],['탐',tam]]:[['국',G.국],['수',G.수],['영',G.영],['탐',tam]]}
function evalMin(c){const pool=poolOf(c.pool),req=c.req||[];const reqs=pool.filter(a=>req.includes(a[0])),rest=pool.filter(a=>!req.includes(a[0])).sort((a,b)=>a[1]-b[1]);
 const pick=[...reqs,...rest].slice(0,0);let used=[...reqs,...rest.slice(0,Math.max(0,c.n-reqs.length))];
 let ok,val;if(c.k==='each'){const good=pool.filter(a=>a[1]<=c.s);ok=good.length>=c.n&&reqs.every(a=>a[1]<=c.s);used=[...reqs,...good.filter(a=>!req.includes(a[0]))].slice(0,c.n);val=`${good.length}개 영역 ${c.s}등급 이내`}else{const s=used.reduce((a,x)=>a+x[1],0);ok=s<=c.s;val=`${c.n}합 ${s}`}
 const hOk=c.h?G.한<=c.h:true;return {ok:ok&&hOk,hOk,val,used:used.map(a=>a[0]+a[1]).join('·')}}
function calc(){return `<section class="panel"><span class="kick">Minimum Check</span><h2>수능최저 계산기</h2><p>예상(또는 모의고사) 등급을 고르면 29개 대학의 <b>2028 대표 수능최저 기준 ${MINS.length}개</b>를 자동으로 판정합니다. 2028 수능은 탐구가 통합사회·통합과학으로 바뀌므로 두 과목 등급을 따로 넣으세요.</p>
 <div class="calc-in" id="cin" style="margin-top:14px">${AREAS.map(([k,l])=>`<label>${l}<select data-a="${k}">${[1,2,3,4,5,6,7,8,9].map(n=>`<option ${G[k]===n?'selected':''}>${n}</option>`).join('')}</select></label>`).join('')}</div>
 <div class="calc-sum" id="csum"></div>
 <div class="note" style="margin-top:14px"><b>판정 방식</b> · ‘탐(1)’은 통합사회·통합과학 중 좋은 등급 1개, ‘5개 영역’은 두 과목을 따로 셉니다. ‘수학 포함’ 등 필수 영역은 반영했지만, <b>＊표시 조건</b>(영어 등급 제한·모집단위별 예외·탐구 평균 등)은 자동 판정에 들어 있지 않습니다. 대표 기준이므로 모집단위별 최종 기준은 대학 모집요강에서 확인하세요.</div></section>
 <section class="panel"><div class="ufilter no-print"><div class="chips"><button class="chip ${CF.only?'on':''}" id="onlyOk">충족만 보기</button></div><input class="inp" id="cq" placeholder="대학·전형 검색 (예: 부산대, 논술)" value="${esc(CF.q)}" style="width:280px;max-width:100%"></div><div id="cres"></div></section>`}
function drawCalc(){const tam=Math.min(G.사,G.과),best=(arr,n)=>arr.slice().sort((a,b)=>a-b).slice(0,n).reduce((a,b)=>a+b,0);const t1=[G.국,G.수,G.영,tam];
 $('csum').innerHTML=[['최고 2합 (탐1)',best(t1,2)],['최고 3합 (탐1)',best(t1,3)],['최고 4합 (탐1)',best(t1,4)],['수학 포함 2합',G.수+best([G.국,G.영,tam],1)],['수학 포함 3합',G.수+best([G.국,G.영,tam],2)]].map(([l,v])=>`<div><span>${l}</span><b>${v}</b></div>`).join('');
 const q=CF.q.trim();const rows=MINS.map(([u,j,c])=>({u,j,c,r:evalMin(c)})).filter(x=>(!q||(x.u+x.j).includes(q))&&(!CF.only||x.r.ok));
 const okN=MINS.filter(([u,j,c])=>evalMin(c).ok).length;
 $('cres').innerHTML=`<p><b>${okN}</b> / ${MINS.length}개 기준 충족 (현재 입력 기준)</p><div class="tw"><table class="res"><thead><tr><th>판정</th><th>대학</th><th>전형</th><th>2028 기준</th><th>내 값</th></tr></thead><tbody>${rows.map(({u,j,c,r})=>`<tr><td><span class="pill ${r.ok?'ok':'no'}">${r.ok?'충족':'미충족'}</span></td><td class="k">${ulink(u)}</td><td>${esc(j)}</td><td>${c.k==='each'?`${c.n}개 영역 각 ${c.s}등급`:`${c.n}합 ${c.s}`}${c.req?` · ${c.req.join('')} 포함`:''}${c.h?` · 한국사 ${c.h}`:''} <span class="muted small">(${c.pool==='sep'?'국·수·영·사·과 5개 영역':c.pool==='t1h'?'한국사 포함 5개 영역':c.pool==='sye'?'수·영·탐(1)':'국·수·영·탐(1)'})</span>${c.x?`<br><span class="small" style="color:var(--warn)">＊${esc(c.x)}</span>`:''}</td><td class="small">${esc(r.val)}<br><span class="muted">${esc(r.used)}${c.h&&!r.hOk?' · 한국사 미충족':''}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">해당 기준이 없습니다.</td></tr>'}</tbody></table></div>`}
function afterCalc(){drawCalc();$('cin').onchange=e=>{const s=e.target.closest('select');if(!s)return;G[s.dataset.a]=+s.value;store.set('grades',G);drawCalc()};
 $('cq').oninput=e=>{CF.q=e.target.value;store.set('cf',CF);drawCalc()};$('onlyOk').onclick=e=>{CF.only=!CF.only;store.set('cf',CF);e.target.classList.toggle('on',CF.only);drawCalc()}}

 <tr><td>선발 방법 변화${CCAT!=='전체'?`<br><span class="tag o">${CCAT}</span>`:''}</td>${cell(meth)}</tr>
 <tr><td>지도 포인트</td>${cell(u=>`<ul>${u.points.map(p=>`<li>${deco(p)}</li>`).join('')}</ul>`)}</tr></tbody></table></div>
 ${new Set(CMP).size<3?'<div class="note">같은 대학이 중복 선택되었습니다.</div>':''}`}
function afterCompare(){drawCompare();$('csel').onchange=e=>{const s=e.target;CMP[+s.dataset.i]=s.value;store.set('cmp',CMP);drawCompare()};
 $('ccat').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;CCAT=b.dataset.c;document.querySelectorAll('#ccat .chip').forEach(c=>c.classList.toggle('on',c===b));drawCompare()}}

/* ---------- 용어·가이드 ---------- */
let ROLE=store.get('role','student');
function guide(){const done=store.get('chk',{});const list=CHECKS[ROLE];const n=list.filter((x,i)=>done[ROLE+i]).length;
 return `<section class="panel"><span class="kick">Guide</span><h2>대상별 가이드</h2>
 <div class="tabs" id="rtabs">${[['student','학생'],['parent','학부모'],['teacher','담임·진학 교사']].map(([k,l])=>`<button data-r="${k}" class="${ROLE===k?'on':''}">${l}</button>`).join('')}</div>
 <div class="grid g2"><div><h3>${ROLE==='student'?'이 순서로 보세요':ROLE==='parent'?'자녀와 이야기하기 전에':'상담 전 확인 순서'}</h3>
 <ol>${(ROLE==='student'?['「맞춤 찾기」에서 내 상황에 답하기','관심 대학 3곳을 ☆ 저장하고 상세 페이지 읽기','「수능최저 계산기」로 모의고사 등급 넣어 보기','「대학 비교」로 관심 대학 나란히 보기','아래 체크리스트 채우기']:ROLE==='parent'?['「핵심 변화 8」에서 큰 흐름 이해하기','「용어 사전」에서 낯선 말 확인하기','자녀와 「맞춤 찾기」를 함께 해 보기','재수 가능성까지 고려해 졸업예정자 한정 전형 확인','상담 질문을 메모로 남기기']:['학생의 희망 대학·전형을 「대학 비교」로 정리','지원자격(졸업연도·추천·지역) 대조','「수능최저 계산기」로 모의고사 등급 점검','정정·확인 필요 항목은 원자료와 모집요강으로 재확인','상담 기록 남기기']).map(x=>`<li>${x}</li>`).join('')}</ol></div>
 <div><h3>체크리스트 <span class="muted small">${n}/${list.length}</span></h3><div class="prog"><i style="width:${n/list.length*100}%"></i></div><div id="chk">${list.map((x,i)=>`<label class="check ${done[ROLE+i]?'done':''}"><input type="checkbox" data-i="${i}" ${done[ROLE+i]?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div></div></div></section>
 <section class="panel"><span class="kick">Roadmap</span><h2>2028 대입 일정 (2025년 고1 입학생)</h2><ul class="tl">${TIMELINE.map(t=>`<li class="${t[3]?'now':''}"><b>${t[0]} · ${esc(t[1])}</b><span>${esc(t[2])}</span></li>`).join('')}</ul><p class="muted small">통상 일정 기준입니다. 확정 일정은 한국대학교육협의회와 각 대학 발표로 확인하세요.</p></section>
 <section class="panel"><span class="kick">Glossary</span><h2>입시 용어 사전</h2><input class="inp no-print" id="gq" placeholder="용어 검색 (예: 배수, 3합, 지역의사)" style="max-width:360px;margin:10px 0"><div id="glist">${GLOSS.map(([a,b])=>`<details class="gl" data-s="${esc(a+' '+b)}"><summary>${esc(a)}</summary><div>${esc(b)}</div></details>`).join('')}</div></section>
 <section class="panel"><span class="kick">FAQ</span><h2>자주 묻는 질문</h2>${FAQ.map(([a,b])=>`<details class="gl"><summary>${esc(a)}</summary><div>${esc(b)}</div></details>`).join('')}</section>
 <section class="panel"><span class="kick">Memo</span><h2>상담 메모</h2><p class="muted small">이 기기에만 저장됩니다. 관심 대학·전형명·확인할 것·다음 할 일을 적어 두세요.</p><textarea class="inp" id="memo" placeholder="예) 부산대 교과우수 — 수학 포함 2합 5, 6모 기준 충족 / 경북대 지역인재 자격 확인">${esc(store.get('memo',''))}</textarea></section>`}
function afterGuide(){$('rtabs').onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;ROLE=b.dataset.r;store.set('role',ROLE);route.keep=true;route()};
 $('chk').onchange=e=>{const d=store.get('chk',{});d[ROLE+e.target.dataset.i]=e.target.checked;store.set('chk',d);route.keep=true;route()};
 $('gq').oninput=e=>{const q=e.target.value.trim();document.querySelectorAll('#glist details').forEach(d=>{const m=!q||d.dataset.s.includes(q);d.style.display=m?'':'none';d.open=!!q&&m})};
 $('memo').oninput=e=>store.set('memo',e.target.value)}

/* ---------- 원자료 ---------- */
function source(p){const open=+p||0;
 return `<section class="panel"><span class="kick">Source & Review</span><h2>원자료 · 검수 정정 이력</h2>
 <p>원자료: 대구고등학교 「2028학년도 대입, 무엇이 달라지나 — 29개 대학 2027 → 2028 대입전형 시행계획 비교」 연수 자료(PPT 90장)와 대학별 인포그래픽 151장. 근거: 각 대학 2027·2028학년도 대학입학전형 시행계획(비수도권 의대 8개교의 2027은 수시·정시 모집요강).</p>
 <div class="grid g2" style="margin-top:12px"><div class="note blue"><b>집계 기준</b> · 모집인원은 재외국민·외국인 특별전형과 재직자·만학도 등 성인 대상 전형을 뺀 인원(계약학과·농어촌·기회균형 등 정원 외 특별전형 포함). 단국대는 죽전캠퍼스.</div>
 <div class="note"><b>이 안내서에 없는 것</b> · 원자료가 언급한 모집단위별 수능최저 엑셀(7,743행)은 포함되지 않았습니다. 수능최저 계산기는 원자료·인포그래픽의 대표 기준만 다룹니다.</div></div>
 <h3 style="margin-top:20px">검수 정정 ${DATA.fixlog.length}건</h3><p class="muted small">원자료 수치를 다시 계산·대조해 바로잡은 내용입니다. 해당 슬라이드는 정정본으로 보여 주며, 원래 표기도 펼쳐 볼 수 있습니다.</p>
 <div class="tw"><table><thead><tr><th>원자료</th><th>정정 내용</th></tr></thead><tbody>${DATA.fixlog.map(f=>`<tr><td class="k"><a href="#source/${f.slide}">${f.slide}장</a></td><td>${esc(f.text)}</td></tr>`).join('')}</tbody></table></div>
 <h3 style="margin-top:16px">확인 필요 ${DATA.caution.length}건</h3><div class="tw"><table><tbody>${DATA.caution.map(f=>`<tr><td class="k"><a href="#source/${f.slide}">${f.slide}장</a></td><td>${esc(f.text)}</td></tr>`).join('')}</tbody></table></div>
 <p class="muted small">검산 범위: 29개 대학 수시·정시 증감, 수시+정시 합계, 전형별 표의 증감·세부 합(가·나·다군 등) 전부. 원자료에 수치 근거가 없는 항목은 ‘검증 불가’로 표시했습니다.</p></section>
 <section class="panel"><div class="ufilter no-print"><h2>원자료 90장</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="inp" id="sq" placeholder="원자료 안에서 찾기" style="width:240px"><button class="btn sm" id="openAll">모두 펼치기</button><button class="btn sm" id="closeAll">모두 접기</button></div></div>
 <div id="slist">${DATA.slides.map(s=>{const tt=s.blocks.find(b=>b.type==='text'&&/변화|핵심|흐름|정리|Part|감사|범위|모집인원|선발|학교폭력|수능|정시|전형/.test(b.text)&&b.text.length<60&&b.text!==s.title)?.text||s.title;const txt=s.blocks.filter(b=>b.type==='text').map(b=>b.text).filter(t=>!/^\d+$/.test(t.trim())).join('\n');
  return `<details class="src" id="s${s.no}" data-s="${esc((s.title+' '+tt+' '+txt+' '+s.blocks.filter(b=>b.type==='table').map(b=>b.rows.flat().join(' ')).join(' ')+' '+(s.note||'')).toLowerCase())}" ${open===s.no?'open':''}><summary><span class="sid">${s.no}장</span>${esc(tt)}${FIXBY[s.no]?' <span class="tag r">정정·확인</span>':''}</summary><div>${fixNotes([s.no])}${s.blocks.some(b=>b.type==='table')?slideBody(s):`<div class="stext">${esc(txt)}</div>`}${s.blocks.some(b=>b.type==='table')&&txt.length>40?`<div class="stext">${esc(txt)}</div>`:''}${s.note?`<div class="snote"><b>발표자 노트 · 집계 메모</b>\n${esc(s.note)}</div>`:''}${RAW[s.no]?`<details class="gl"><summary>정정 전 원래 표기 보기</summary><div>${slideBody(RAW[s.no])}${RAW[s.no].blocks.filter(b=>b.type==='text'&&b.text.length>60).map(b=>`<div class="stext">${esc(b.text)}</div>`).join('')}</div></details>`:''}</div></details>`}).join('')}</div></section>`}
function afterSource(p){if(+p){const d=$('s'+p);if(d){d.open=true;setTimeout(()=>d.scrollIntoView({block:'start'}),50)}}
 $('sq').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#slist>details').forEach(d=>{d.style.display=!q||d.dataset.s.includes(q)?'':'none'})};
 $('openAll').onclick=()=>document.querySelectorAll('#slist details').forEach(d=>d.open=true);$('closeAll').onclick=()=>document.querySelectorAll('#slist details').forEach(d=>d.open=false)}

/* ---------- 통합 검색 ---------- */
let IDX=null;
function buildIdx(){IDX=[];U.forEach(u=>{const h='#uni/'+encodeURIComponent(u.name);
  IDX.push({w:u.name,t:'대학',x:[u.full,u.struct,u.change].join(' · '),h,boost:3});
  u.points.forEach(p=>IDX.push({w:u.name+' · 지도 포인트',t:'대학',x:p,h}));
  u.counts.forEach(r=>IDX.push({w:u.name+' · 전형별 인원',t:'전형',x:`${r.k} ${r.sub}: ${r.a} → ${r.b} (${r.d})`,h}));
  u.methods.forEach(r=>IDX.push({w:u.name+' · 선발 방법',t:'전형',x:`${r.k}: ${r.a}${r.same?'':' → '+r.b}`,h}));
  const o=DATA.ocr[u.name]||{};['compare','detail'].forEach(g=>Object.entries(o[g]||{}).forEach(([i,t])=>t.split('\n').forEach(line=>{if(line.length>3)IDX.push({w:`${u.name} · 인포그래픽 ${u.images[g][i]}`,t:'이미지 글자',x:line,h,img:[g,+i]})})))});
 DATA.slides.forEach(s=>{const txt=s.blocks.map(b=>b.type==='text'?b.text:b.rows.map(r=>r.join(' | ')).join('\n')).join('\n');txt.split('\n').forEach(line=>{if(line.length>3&&!/^\d+$/.test(line))IDX.push({w:`원자료 ${s.no}장`,t:'원자료',x:line,h:'#source/'+s.no})});if(s.note)IDX.push({w:`원자료 ${s.no}장 · 메모`,t:'원자료',x:s.note,h:'#source/'+s.no})});
 GLOSS.forEach(([a,b])=>IDX.push({w:'용어 사전',t:'용어',x:a+' — '+b,h:'#guide',boost:2}));FAQ.forEach(([a,b])=>IDX.push({w:'FAQ',t:'용어',x:a+' — '+b,h:'#guide'}))}
function hl(t,terms){let s=esc(t);terms.forEach(q=>{const e=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');s=s.replace(new RegExp(e,'gi'),m=>`<mark>${m}</mark>`)});return s}
function snip(t,q){const i=t.toLowerCase().indexOf(q.toLowerCase());if(t.length<160||i<0)return t.slice(0,180);const a=Math.max(0,i-60);return (a?'…':'')+t.slice(a,a+170)+'…'}
let SF='전체';
function search(q){q=q||'';if(!IDX)buildIdx();const terms=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
 const hit=terms.length?IDX.filter(it=>{const s=(it.w+' '+it.x).toLowerCase();return terms.every(t=>s.includes(t))}):[];
 hit.sort((a,b)=>(b.boost||0)-(a.boost||0));
 const types=['전체','대학','전형','이미지 글자','원자료','용어'];const cnt=t=>t==='전체'?hit.length:hit.filter(h=>h.t===t).length;
 const show=hit.filter(h=>SF==='전체'||h.t===SF).slice(0,120);
 const uh=[...new Set(hit.map(h=>h.w.split(' · ')[0]).filter(n=>NAMES.includes(n)))];
 return `<section class="panel"><span class="kick">Search</span><h2>“${esc(q)}” 검색 결과 <span class="muted small">${hit.length}건</span></h2>
 ${uh.length?`<p class="small" style="margin-top:8px">관련 대학: ${uh.map(n=>`<a class="chip" style="display:inline-block;margin:2px" href="#uni/${encodeURIComponent(n)}">${n}</a>`).join('')}</p>`:''}
 <div class="chips no-print" id="sf" style="margin:12px 0">${types.map(t=>`<button class="chip ${SF===t?'on':''}" data-t="${t}">${t}<span class="n">${cnt(t)}</span></button>`).join('')}</div>
 <div class="sres">${show.map(it=>`<a class="sitem" href="${it.h}" ${it.img?`data-img="${it.img.join(',')}"`:''}><div class="where">${esc(it.t)} · ${esc(it.w)}</div><div class="txt">${hl(snip(it.x,terms[0]||''),terms)}</div></a>`).join('')||`<div class="empty">결과가 없습니다. 띄어쓰기를 바꾸거나 더 짧은 낱말로 찾아 보세요. (예: “지역의사”, “3합 7”, “면접 40”)</div>`}</div>
 ${hit.length>show.length?`<p class="muted small">상위 ${show.length}건만 표시합니다. 낱말을 더 넣어 좁혀 보세요.</p>`:''}
 <p class="muted small" style="margin-top:10px">‘이미지 글자’는 인포그래픽을 자동 인식한 글자로, 오탈자가 있을 수 있습니다. 누르면 해당 대학의 이미지 탭으로 이동합니다.</p></section>`}
function afterSearch(q){$('sf').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;SF=b.dataset.t;route.keep=true;route()};
 document.querySelectorAll('.sitem[data-img]').forEach(a=>a.addEventListener('click',()=>{const [g]=a.dataset.img.split(',');UTAB='img';ITAB=g}));
 const inp=$('tq');if(inp&&inp.value!==q)inp.value=q}

const VIEWS={home,flows,flow,unis,uni,match,calc,compare,guide,source,search};
const AFTER={unis:afterUnis,uni:afterUni,match:afterMatch,calc:afterCalc,compare:afterCompare,guide:afterGuide,source:afterSource,search:afterSearch};

/* ---------- 시작 ---------- */
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#uni/'))UTAB=UTAB;route()});
document.addEventListener('DOMContentLoaded',()=>{
 $('tsf').onsubmit=e=>{e.preventDefault();const q=$('tq').value.trim();if(q){SF='전체';location.hash='search/'+encodeURIComponent(q)}};
 let tmr;$('tq').oninput=e=>{clearTimeout(tmr);const q=e.target.value.trim();if(q.length>=2)tmr=setTimeout(()=>{SF='전체';history.replaceState(null,'','#search/'+encodeURIComponent(q));route.keep=true;route()},350)};
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('tq').focus()}
  if($('lb').classList.contains('open')){if(e.key==='Escape')closeZoom();if(e.key==='ArrowRight'){ZB.i=(ZB.i+1)%ZB.u.images[ZB.g].length;drawZoom()}if(e.key==='ArrowLeft'){ZB.i=(ZB.i-1+ZB.u.images[ZB.g].length)%ZB.u.images[ZB.g].length;drawZoom()}}});
 $('lbClose').onclick=closeZoom;$('lbIn').onclick=()=>{ZB.s=Math.min(3,ZB.s+.25);drawZoom()};$('lbOut').onclick=()=>{ZB.s=Math.max(.5,ZB.s-.25);drawZoom()};
 $('lbPrev').onclick=()=>{ZB.i=(ZB.i-1+ZB.u.images[ZB.g].length)%ZB.u.images[ZB.g].length;drawZoom()};$('lbNext').onclick=()=>{ZB.i=(ZB.i+1)%ZB.u.images[ZB.g].length;drawZoom()};
 const tt=$('totop');window.addEventListener('scroll',()=>tt.classList.toggle('show',scrollY>900),{passive:true});tt.onclick=()=>scrollTo({top:0,behavior:'smooth'});
 if(LITE)$('ver').textContent='가벼운판(이미지 제외)';
 route()});

</script>
